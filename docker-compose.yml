services:
  web:
    image: recipe-budget-service:${APP_IMAGE_TAG:-local}
    build:
      context: .
      network: host
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: recipe_budget_service_web
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/app.db}
      DATA_DIR: /app/data
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-localhost}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      BACKUP_ADMIN_USERNAME: ${BACKUP_ADMIN_USERNAME:-}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      ENFORCE_SAME_ORIGIN: ${ENFORCE_SAME_ORIGIN:-true}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      BACKGROUND_JOBS_ENABLED: ${BACKGROUND_JOBS_ENABLED:-true}
      TIMER_REMINDER_MINUTES: ${TIMER_REMINDER_MINUTES:-120}
      HOME_PUSH_ENABLED: ${HOME_PUSH_ENABLED:-false}
      HOME_PUSH_POLL_SECONDS: ${HOME_PUSH_POLL_SECONDS:-60}
      HOME_PUSH_CATCHUP_MINUTES: ${HOME_PUSH_CATCHUP_MINUTES:-60}
      HOME_VAPID_SUBJECT: ${HOME_VAPID_SUBJECT:-mailto:admin@example.com}
      HOME_VAPID_PUBLIC_KEY: ${HOME_VAPID_PUBLIC_KEY:-}
      HOME_VAPID_PRIVATE_KEY: ${HOME_VAPID_PRIVATE_KEY:-}
      PUSH_ENDPOINT_HOSTS: ${PUSH_ENDPOINT_HOSTS:-}
      HOME_AI_ENABLED: ${HOME_AI_ENABLED:-false}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_CONNECT_TIMEOUT_SECONDS: ${AI_CONNECT_TIMEOUT_SECONDS:-5}
      AI_READ_TIMEOUT_SECONDS: ${AI_READ_TIMEOUT_SECONDS:-120}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-512}
      AI_CONTEXT_BUDGET: ${AI_CONTEXT_BUDGET:-6000}
      AI_MAX_CONCURRENCY: ${AI_MAX_CONCURRENCY:-1}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.2}
      AI_ENABLE_THINKING: ${AI_ENABLE_THINKING:-false}
    extra_hosts:
      # Linux Docker: this name resolves to the host gateway. llama-server is
      # managed by systemd on the host and is never published by Compose/Caddy.
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: unless-stopped
    stop_grace_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    container_name: recipe_budget_service_caddy
    depends_on:
      web:
        condition: service_healthy
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:
