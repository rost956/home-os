{% extends "base.html" %}{% block title %}{{ 'Редактировать заправку' if entry else 'Новая заправка' }}{% endblock %}{% block content %}<div class="page-head compact-head"><h1>{{ 'Редактировать заправку' if entry else 'Новая заправка' }}</h1><a class="icon-btn" href="/vehicles/{{ vehicle.id }}/fuel">←</a></div>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}<form class="card form vehicle-form" method="post" action="{{ '/vehicles/' ~ vehicle.id ~ '/fuel/' ~ entry.id ~ '/edit' if entry else '/vehicles/' ~ vehicle.id ~ '/fuel' }}"><div class="form-row two-cols"><label>Дата *<input type="date" name="occurred_on" value="{{ form.occurred_on if form else today.isoformat() }}" required></label><label>Пробег *<input type="number" name="odometer" min="0" value="{{ form.odometer if form else vehicle.current_odometer }}" required></label></div><div class="form-row two-cols"><label>Литры *<input name="liters" inputmode="decimal" value="{{ form.liters if form else '' }}" required></label><label>Стоимость *<input name="total_cost" inputmode="decimal" value="{{ form.total_cost if form else '' }}" required></label></div><label class="check-row"><input type="checkbox" name="full_tank" {% if form and form.full_tank %}checked{% endif %}> Полный бак</label><label>АЗС<input name="fuel_station" maxlength="180" value="{{ form.fuel_station if form else '' }}"></label><label>Заметки<textarea name="notes">{{ form.notes if form else '' }}</textarea></label><button class="btn">Сохранить заправку</button></form>{% endblock %}
