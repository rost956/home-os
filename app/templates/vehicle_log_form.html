{% extends "base.html" %}
{% block title %}{{ 'Редактировать запись' if entry else 'Новая запись' }}{% endblock %}
{% block content %}
<div class="page-head compact-head"><div><h1>{{ 'Редактировать запись' if entry else 'Новая запись' }}</h1><div class="subline">{{ vehicle.title }} · бортовой журнал</div></div><a class="icon-btn" href="{{ '/vehicles/' ~ vehicle.id ~ '/log/' ~ entry.id if entry else '/vehicles/' ~ vehicle.id ~ '/log' }}" aria-label="Назад"><svg class="icon"><use href="#i-arrow-left"></use></svg></a></div>
{% if error %}<div class="alert error">{{ error }}</div>{% endif %}
<form method="post" action="{{ '/vehicles/' ~ vehicle.id ~ '/log/' ~ entry.id ~ '/edit' if entry else '/vehicles/' ~ vehicle.id ~ '/log' }}" class="card form vehicle-form vehicle-log-form"><div class="form-row two-cols"><label>Дата *<input type="date" name="occurred_on" value="{{ form.occurred_on }}" required></label><label>Тип *<select name="entry_type" required>{% for key, label in vehicle_log_type_labels.items() %}<option value="{{ key }}" {% if form.entry_type == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label></div><label>Название *<input name="title" maxlength="160" value="{{ form.title }}" required placeholder="Например, замена масла"></label><div class="form-row two-cols"><label>Пробег, км<input name="odometer" type="number" min="0" max="10000000" value="{{ form.odometer }}" inputmode="numeric"></label><label>Стоимость, ₽<input name="cost" type="text" inputmode="decimal" value="{{ form.cost }}" placeholder="Необязательно"></label></div><label>Место / сервис<input name="service_location" maxlength="180" value="{{ form.service_location }}" placeholder="Необязательно"></label><label>Описание<textarea name="description" maxlength="10000" rows="5">{{ form.description }}</textarea></label><label>Заметки<textarea name="notes" maxlength="4000" rows="4">{{ form.notes }}</textarea></label><button class="btn" type="submit">{{ 'Сохранить изменения' if entry else 'Добавить запись' }}</button></form>
{% endblock %}
