name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Deployment script regression tests
        run: bash tests/test_deploy_production.sh
      - name: Test
        run: python -m pytest
      - name: Import smoke test
        env:
          APP_ENV: test
          SECRET_KEY: ci-secret-key-with-at-least-thirty-two-characters
          DATA_DIR: ${{ runner.temp }}/home-service-data
          DATABASE_URL: sqlite:///${{ runner.temp }}/home-service-data/smoke.db
          BACKGROUND_JOBS_ENABLED: "false"
        run: python -c "from app.main import app; assert app.title"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: >-
          docker build --pull
          --build-arg APP_UID="$(id -u)"
          --build-arg APP_GID="$(id -g)"
          --tag recipe-budget-service:ci .
      - name: Start and verify container health
        run: |
          mkdir -p "${RUNNER_TEMP}/home-service-data"
          docker run -d --name home-service-ci \
            -p 127.0.0.1:18000:8000 \
            -e APP_ENV=production \
            -e SECRET_KEY=ci-secret-key-with-at-least-thirty-two-characters \
            -e DATA_DIR=/app/data \
            -e DATABASE_URL=sqlite:///./data/app.db \
            -e ALLOWED_HOSTS=127.0.0.1,localhost \
            -e SECURE_COOKIES=false \
            -e ENFORCE_SAME_ORIGIN=false \
            -e BACKGROUND_JOBS_ENABLED=false \
            -v "${RUNNER_TEMP}/home-service-data:/app/data" \
            recipe-budget-service:ci
          for attempt in $(seq 1 30); do
            STATUS="$(docker inspect --format '{{.State.Health.Status}}' home-service-ci)"
            if [ "$STATUS" = healthy ]; then
              curl --fail --silent http://127.0.0.1:18000/health
              exit 0
            fi
            if [ "$STATUS" = unhealthy ]; then
              break
            fi
            sleep 2
          done
          docker logs home-service-ci
          exit 1
      - name: Container logs
        if: failure()
        run: docker logs home-service-ci || true
      - name: Stop container
        if: always()
        run: docker rm -f home-service-ci || true
